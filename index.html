<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Tripulante Share Brasil</title>

    <meta name="description" content="Portal do Tripulante Share Brasil" />
    <meta name="author" content="Share Brasil" />

    <meta name="theme-color" content="#061223" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trip Share" />

    <meta property="og:title" content="Tripulante Share Brasil" />
    <meta property="og:description" content="Portal do Tripulante Share Brasil" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripulante Share Brasil" />
    <meta name="twitter:description" content="Portal do Tripulante Share Brasil" />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Manifest condicional -->
    <script>
      const isGithubDev =
        location.hostname.includes('github.dev') ||
        location.hostname.includes('app.github.dev');

      if (!isGithubDev) {
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = '/manifest.json';
        document.head.appendChild(link);
      } else {
        console.log('Manifest PWA desativado no ambiente GitHub Dev');
      }
    </script>

    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
